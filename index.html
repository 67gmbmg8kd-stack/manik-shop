<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MANIK">
<meta name="theme-color" content="#101114">
<title>MANIK ELECTRIC &amp; ELECTRONICS SERVICE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#101114;--mute:#6b7280;--line:#e3e7ee;--blue:#1769e0;--good:#14804a;--bad:#c62828;--warn:#b45309}
:root[data-theme=dark]{--bg:#0e0f12;--card:#17191e;--ink:#f1f3f6;--mute:#9aa3b2;--line:#262a32;--blue:#4b8ef5;--good:#3ecf8e;--bad:#ff6b6b;--warn:#f5a524}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Bengali',system-ui,sans-serif;font-size:16px;line-height:1.5}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#101114;color:#fff}
.top b{flex:1;font-size:14px;line-height:1.2}
.ib{background:#ffffff1a;border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:18px}
.banner{margin:12px 14px;border-radius:18px;padding:22px 18px;color:#fff;background:linear-gradient(135deg,#101114 0%,#0b2a5b 60%,#1769e0 100%);position:relative;overflow:hidden}
.banner svg.c{position:absolute;right:-10px;top:0;height:100%;opacity:.25}
.banner h1{margin:8px 0 2px;font-size:17px;line-height:1.3;position:relative}
.banner p{margin:0;font-size:12px;opacity:.85;position:relative}
main{padding:0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card small{color:var(--mute);display:block;font-size:12px}
.card strong{font-size:20px;display:block;margin-top:2px}
.card.wide{grid-column:1/-1}
.card.hero strong{font-size:28px;color:var(--blue)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
h2{font-size:16px;margin:18px 2px 8px}
.note{color:var(--mute);font-size:13px;margin:12px 2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;color:var(--mute)}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--blue);font-weight:700}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;width:100%}
.btn:disabled{opacity:.55}
.btn.sm{width:auto;padding:8px 14px}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:4px 0 12px}
label{font-size:13px;color:var(--mute)}
.login{max-width:420px;margin:0 auto;padding:28px 18px}
.login .logo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:22px}
.err{background:#c6282820;color:var(--bad);padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line)}
.sheet{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:14px;right:14px;top:calc(12px + env(safe-area-inset-top,0px));background:#101114;color:#fff;padding:12px 14px;border-radius:12px;z-index:30;font-size:14px;border-left:4px solid var(--blue)}
.toast.e{border-color:var(--bad)}
.spin{display:block;width:30px;height:30px;margin:40px auto;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) - 50px);left:50%;margin-left:-18px;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;z-index:15;transition:transform .15s}
[hidden]{display:none!important}
@media(min-width:760px){body{max-width:760px;margin:0 auto}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
</head>
<body>
<div id="ptr"><i class="spin" style="margin:0;width:18px;height:18px"></i></div>
<div id="app"></div>
<script>
const sb=supabase.createClient('https://xejpvkhjjapqytxbnwnp.supabase.co','sb_publishable_qhyMBqYT_iwIvjDPEmCCRg_g0gZh-1n');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'৳'+Number(n||0).toLocaleString('bn-BD',{maximumFractionDigits:2});
const qty=n=>Number(n||0).toLocaleString('bn-BD',{maximumFractionDigits:3});
const sum=(a,f)=>a.reduce((s,x)=>s+Number(f(x)||0),0);
let me=null,tab='dash',busy=false,period='day';
const BACKUP_DAYS=5;
const PL={day:'আজকের',week:'এই সপ্তাহের',month:'এই মাসের',year:'এই বছরের'};

const LOGO='<svg width="56" height="56" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#101114" stroke="#1769e0" stroke-width="2"/><path d="M27 8 14 27h8l-3 13 15-21h-9z" fill="#1769e0"/></svg>';
const CIRCUIT='<svg class="c" viewBox="0 0 200 100" fill="none" stroke="#fff" stroke-width="1.5"><path d="M0 20h60l10 10h50M0 50h40l15 15h70l10-10h40M0 80h90l10-10h100"/><circle cx="120" cy="30" r="4"/><circle cx="125" cy="65" r="4"/><circle cx="100" cy="70" r="4"/></svg>';

// Bangladesh day start (UTC+6, no DST) as ISO
function dayStart(){const off=6*36e5,d=new Date(Date.now()+off);return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-off).toISOString()}
function periodStart(p){const off=6*36e5,d=new Date(Date.now()+off),Y=d.getUTCFullYear(),M=d.getUTCMonth(),D=d.getUTCDate();let t=Date.UTC(Y,M,D)-off;
  if(p==='week')t-=((d.getUTCDay()+1)%7)*864e5;else if(p==='month')t=Date.UTC(Y,M,1)-off;else if(p==='year')t=Date.UTC(Y,0,1)-off;return new Date(t).toISOString()}
// read all rows (Supabase returns max 1000 per request)
async function all(mk){let out=[],from=0;for(;;){const{data,error}=await mk().range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)return out;from+=1000}}

function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' e':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
try{theme(localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}catch(e){}

/* ---------- LOGIN ---------- */
function loginView(msg){
  $('#app').innerHTML=`<div class="login"><div class="logo">${LOGO}<b>MANIK ELECTRIC &amp; ELECTRONICS SERVICE</b><small style="color:var(--mute)">ELECTRICAL &amp; ELECTRONICS SALES AND REPAIR</small></div>
  ${msg?`<div class="err">${esc(msg)}</div>`:''}
  <label>ইমেইল</label><input id="em" type="email" autocomplete="username" inputmode="email">
  <label>পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="go">লগইন করুন</button></div>`;
  $('#go').onclick=async()=>{
    if(busy)return;busy=true;const b=$('#go');b.disabled=true;b.textContent='অপেক্ষা করুন...';
    const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    busy=false;
    if(error)return loginView('লগইন হয়নি: ইমেইল বা পাসওয়ার্ড ঠিক নেই।');
    afterLogin(data.user);
  };
}
async function afterLogin(user){
  const{data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error||!p||!p.is_active){await sb.auth.signOut();return loginView('আপনার অ্যাকাউন্ট এখনো চালু করা হয়নি। Owner-এর সাথে যোগাযোগ করুন।')}
  me=p;shell();go('dash');
}

/* ---------- SHELL ---------- */
function shell(){
  $('#app').innerHTML=`<div class="top"><b>MANIK ELECTRIC &amp; ELECTRONICS</b>
  <button class="ib" id="rf" title="রিফ্রেশ">⟳</button><button class="ib" id="th" title="Dark/Light">◐</button><button class="ib" id="lo" title="লগআউট">⏻</button></div>
  <div class="banner">${CIRCUIT}${LOGO.replace('width="56" height="56"','width="44" height="44"')}<h1>MANIK ELECTRIC &amp; ELECTRONICS SERVICE</h1><p>Electrical &amp; Electronics Sales and Repair</p></div>
  <main id="view"></main>
  <nav><button data-t="dash"><span>▦</span>ড্যাশবোর্ড</button><button data-t="inv"><span>▤</span>পণ্য</button><button data-t="buy"><span>⬇</span>ক্রয়</button><button data-t="sales"><span>৳</span>বিক্রি</button><button data-t="svc"><span>✚</span>সার্ভিস</button></nav>`;
  $('#rf').onclick=refresh;
  $('#th').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
  $('#lo').onclick=async()=>{await sb.auth.signOut();me=null;loginView()};
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
}
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));refresh()}
async function refresh(){
  const v=$('#view');v.innerHTML='<i class="spin"></i>';
  try{
    if(tab==='dash')await dash();else if(tab==='inv')await inv();else if(tab==='buy')await txn('buy');else if(tab==='sales')await txn('sale');else if(tab==='open')await txn('open');
    else v.innerHTML='<p class="note">এই অংশ পরের ধাপে তৈরি হবে। এখনো এটি চালু নয়।</p>';
  }catch(e){v.innerHTML=`<div class="err">তথ্য আনা যায়নি: ${esc(e.message||e)}</div>`}
}

/* ---------- DASHBOARD (all numbers come from the database) ---------- */
async function dash(){
  const st=periodStart(period),own=me.role==='owner';
  const[today,dues,pdues,prods,cash,cfg]=await Promise.all([
    all(()=>sb.from('sales').select('total,paid,due,cost_total').eq('status','active').gte('sale_date',st)),
    all(()=>sb.from('sales').select('due').eq('status','active').gt('due',0)),
    all(()=>sb.from('purchases').select('due').eq('status','active').gt('due',0)),
    all(()=>sb.from('products').select('id,name,current_stock,min_stock,base_unit').eq('is_active',true)),
    all(()=>sb.from('cash_transactions').select('direction,amount').eq('status','active').eq('method','cash')),
    own?sb.from('shop_settings').select('last_backup_at').eq('id',1).single():Promise.resolve({})
  ]);
  const last=cfg?.data?.last_backup_at,days=last?Math.floor((Date.now()-new Date(last))/864e5):null,bdue=own&&(days===null||days>=BACKUP_DAYS),bmsg=days===null?'এখনো কোনো ব্যাকআপ নেওয়া হয়নি।':'শেষ ব্যাকআপ নেওয়া হয়েছে '+qty(days)+' দিন আগে।';
  const total=sum(today,s=>s.total),profit=sum(today,s=>s.total-s.cost_total);
  const bal=sum(cash.filter(c=>c.direction==='in'),c=>c.amount)-sum(cash.filter(c=>c.direction==='out'),c=>c.amount);
  const low=prods.filter(p=>Number(p.min_stock)>0&&Number(p.current_stock)<=Number(p.min_stock));
  const card=(l,v,c='')=>`<div class="card"><small>${l}</small><strong class="${c}">${v}</strong></div>`;
  $('#view').innerHTML=`${bdue?`<div class="card" style="border:2px solid var(--bad);background:#c6282818;margin-bottom:12px"><b class="bad" style="font-size:18px">⚠️ ব্যাকআপ নেওয়ার সময় হয়েছে!</b><p style="margin:6px 0">${bmsg} ডেটা হারিয়ে গেলে ফেরত পাওয়া কঠিন হবে।</p><button class="btn" id="bk2">⬇ এখনই ব্যাকআপ নিন</button></div>`:''}<div class="row" style="gap:6px;margin-bottom:10px">${[['day','আজ'],['week','সপ্তাহ'],['month','মাস'],['year','বছর']].map(([k,l])=>`<button class="btn ${k===period?'':'ghost'} sm" data-p="${k}" style="flex:1">${l}</button>`).join('')}</div><div class="grid">
   <div class="card wide hero"><small>${PL[period]} মোট বিক্রি</small><strong>${money(total)}</strong></div>
   ${card(PL[period]+' আনুমানিক লাভ',money(profit),profit<0?'bad':'good')}
   ${card(PL[period]+' বিক্রির সংখ্যা',qty(today.length))}
   ${card(PL[period]+' নগদ পাওয়া',money(sum(today,s=>s.paid)))}
   ${card(PL[period]+' বাকি বিক্রি',money(sum(today,s=>s.due)),'warn')}
   ${card('মোট বাকি পাওনা',money(sum(dues,s=>s.due)))}
   ${card('মোট বাকি দেনা',money(sum(pdues,s=>s.due)))}
   ${card('মোট পণ্য',qty(prods.length))}
   ${card('স্টকে আছে',qty(prods.filter(p=>Number(p.current_stock)>0).length))}
   <div class="card wide"><small>দোকানের বর্তমান নগদ ক্যাশ</small><strong>${money(bal)}</strong></div>
  </div>
  ${low.length?`<h2>⚠️ স্টক কমে গেছে</h2>`+low.map(p=>`<div class="card row" style="margin-bottom:8px"><span>${esc(p.name)}</span><span class="warn">${qty(p.current_stock)} ${esc(p.base_unit)} (সর্বনিম্ন ${qty(p.min_stock)})</span></div>`).join(''):''}
  <p class="note">আজকের খরচ ও সার্ভিসিং আয় এখনো যুক্ত হয়নি (পরের ধাপে আসবে)। লাভের হিসাব এখন শুধু পণ্য বিক্রি থেকে।</p>${own?'<button class="btn ghost" id="bk">⬇ ব্যাকআপ ডাউনলোড (শুধু Owner)</button><p class="note">ব্যাকআপে সব হিসাব ও সব ছবি থাকে (ছবি আলাদা ZIP ফাইলে)। সপ্তাহে অন্তত একবার ডাউনলোড করে iCloud বা Files-এ রাখুন।</p><h2 class="bad">⚠️ ঝুঁকিপূর্ণ কাজ (শুধু Owner)</h2><button class="btn ghost" id="rz" style="color:var(--bad)">টেস্ট ডেটা মুছে সব শূন্য করুন</button>':''}`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{period=b.dataset.p;refresh()});
  if(own){$('#bk').onclick=backup;$('#rz').onclick=resetAll}
  if(bdue){$('#bk2').onclick=backup;if(!window._bkShown){window._bkShown=1;popup(`<h2 class="bad">⚠️ ব্যাকআপ নেওয়ার সময় হয়েছে!</h2><p>${bmsg}<br>প্রতি ${qty(BACKUP_DAYS)} দিনে একবার ব্যাকআপ নিন, নইলে ডেটা হারালে ফেরত পাওয়া কঠিন হবে।</p><button class="btn" id="bk3" style="margin-bottom:10px">⬇ এখনই ব্যাকআপ নিন</button>`);$('#bk3').onclick=e=>{e.target.closest('.sheet').remove();backup({currentTarget:$('#bk')})}}}
}

/* ---------- INVENTORY ---------- */
async function inv(){
  const prods=await all(()=>sb.from('products').select('*').eq('is_active',true).order('name'));
  const own=true; // staff may add/edit/delete products
  $('#view').innerHTML=`<div class="row" style="margin-bottom:10px"><input id="q" placeholder="পণ্য খুঁজুন (নাম, ব্র্যান্ড, কোড)" style="margin:0">${own?'<button class="btn sm" id="add">+ নতুন</button>':''}</div><button class="btn ghost" id="os" style="margin-bottom:8px">⬆ আগের মজুদ তুলুন (ক্যাশে প্রভাব নেই)</button>${own?'<p class="note" style="margin:0 0 8px">পণ্যে চাপলে সম্পাদনা বা মুছে ফেলা যাবে।</p>':''}<div id="pl"></div>`;
  const draw=()=>{const k=$('#q').value.trim().toLowerCase();
    const f=prods.filter(p=>[p.name,p.brand,p.code,p.model_no].join(' ').toLowerCase().includes(k));
    $('#pl').innerHTML=f.length?f.map(p=>`<div class="card" ${own?`data-pid="${p.id}"`:''} style="margin-bottom:8px;${own?'cursor:pointer':''}"><div class="row"><b>${esc(p.name)}</b><span class="pill">${esc(p.base_unit)}</span></div>
      <div class="row"><small style="color:var(--mute)">${esc([p.brand,p.model_no,p.code].filter(Boolean).join(' • '))}</small>
      <span class="${Number(p.min_stock)>0&&Number(p.current_stock)<=Number(p.min_stock)?'warn':''}">স্টক: ${qty(p.current_stock)}</span></div>
      <div class="row"><small>বিক্রয়মূল্য ${money(p.sale_price)}</small>${own?`<small>গড় ক্রয়মূল্য ${money(p.avg_cost)}</small>`:''}</div></div>`).join(''):'<p class="note">কোনো পণ্য নেই।'+(own?' উপরে "+ নতুন" চেপে প্রথম পণ্য যোগ করুন।':'')+'</p>'};
  $('#q').oninput=draw;draw();
  $('#os').onclick=()=>{tab='open';document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));refresh()};
  if(own){$('#add').onclick=()=>prodForm();$('#pl').onclick=e=>{const c=e.target.closest('[data-pid]');if(c)prodForm(prods.find(p=>p.id===c.dataset.pid))}}
}
/* ---------- PRODUCT ADD / EDIT / DELETE ---------- */
async function prodForm(p){
  const e=!!p,[{data:cats},{data:units}]=await Promise.all([sb.from('categories').select('id,name').order('name'),sb.from('units').select('code,name_bn').order('code')]);
  const v=x=>esc(x??''),s=document.createElement('div');s.className='sheet';
  s.innerHTML=`<div><h2 style="margin-top:0">${e?'পণ্য সম্পাদনা':'নতুন পণ্য'}</h2>
  <label>পণ্যের নাম *</label><input id="n" value="${v(p?.name)}">
  <label>Category</label><select id="c"><option value="">— নির্বাচন করুন —</option>${cats.map(c=>`<option value="${c.id}" ${c.id===p?.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <label>Brand</label><input id="b" value="${v(p?.brand)}"><label>Model Number</label><input id="m" value="${v(p?.model_no)}"><label>Product Code</label><input id="k" value="${v(p?.code)}">

/* ---------- PHOTOS (memo / receipt) ---------- */
const fd=t=>new Date(t).toLocaleString('bn-BD',{timeZone:'Asia/Dhaka',dateStyle:'short',timeStyle:'short'});
const shrink=async f=>{if(!f.type.startsWith('image/'))throw new Error('শুধু ছবি দেওয়া যাবে');if(f.size>20e6)throw new Error('ছবি খুব বড় (২০ MB-এর বেশি)');
  const b=await createImageBitmap(f),k=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  return new Promise((ok,no)=>c.toBlob(x=>x?ok(x):no(new Error('ছবি প্রস্তুত করা যায়নি')),'image/jpeg',.72))};
async function upload(type,id,files){let ok=0;for(const f of files){try{const blob=await shrink(f),path=`${type}/${id}/${crypto.randomUUID()}.jpg`;
  const u=await sb.storage.from('shop-files').upload(path,blob,{contentType:'image/jpeg'});if(u.error)throw u.error;
  const a=await sb.from('attachments').insert({owner_type:type,owner_id:id,kind:'memo',storage_path:path,created_by:me.id});if(a.error)throw a.error;ok++}catch(e){toast('ছবি যায়নি: '+(e.message||e),1)}}return ok}
async function viewer(type,id){
  const s=document.createElement('div');s.className='sheet';s.innerHTML='<div><i class="spin"></i></div>';document.body.appendChild(s);
  const draw=async()=>{const{data:at}=await sb.from('attachments').select('storage_path').eq('owner_type',type).eq('owner_id',id).order('created_at'),n=at?.length||0;
    const{data:su}=n?await sb.storage.from('shop-files').createSignedUrls(at.map(a=>a.storage_path),3600):{data:[]};
    s.firstChild.innerHTML=`<h2 style="margin-top:0">মেমো / রসিদের ছবি</h2>${su?.length?`<div class="grid">${su.map(u=>`<a href="${esc(u.signedUrl)}" target="_blank"><img src="${esc(u.signedUrl)}" style="width:100%;border-radius:10px"></a>`).join('')}</div><p class="note">ছবিতে চাপলে বড় করে দেখা যাবে।</p>`:'<p class="note">কোনো ছবি নেই।</p>'}
    <label>নতুন ছবি যোগ করুন (এখন ${qty(n)}/১৫)</label><input id="vf" type="file" accept="image/*" multiple><div class="row"><button class="btn ghost" id="vx">বন্ধ করুন</button><button class="btn" id="vu">ছবি আপলোড</button></div>`;
    $('#vx').onclick=()=>s.remove();
    $('#vu').onclick=async()=>{const f=[...$('#vf').files].slice(0,15-n);if(!f.length)return toast('ছবি বেছে নিন (সর্বোচ্চ ১৫টি)',1);$('#vu').disabled=true;await upload(type,id,f);draw()}};

/* ---------- RESET ALL DATA (Owner, irreversible) ---------- */
async function resetAll(){
  if(!confirm('⚠️ সব বিক্রি, ক্রয়, পেমেন্ট, ক্যাশ ও মেমোর ছবি চিরতরে মুছে যাবে এবং ড্যাশবোর্ড শূন্য হয়ে যাবে। এটি আর ফেরানো যাবে না।\n\nগত ২৪ ঘণ্টার মধ্যে ব্যাকআপ নেওয়া থাকতে হবে। এগিয়ে যাবেন?'))return;
  const master=confirm('পণ্য, কাস্টমার ও Supplier-এর তালিকাও কি মুছবেন?\n\nOK = সবকিছু মুছুন (একদম ফাঁকা)\nCancel = তালিকা থাকুক, শুধু স্টক ও হিসাব শূন্য হবে');
  if(prompt('নিশ্চিত করতে ইংরেজিতে লিখুন: RESET')!=='RESET')return toast('বাতিল করা হয়েছে',1);
  const r=await sb.rpc('reset_all_data',{p_confirm:'RESET',p_include_master:master});
  if(r.error)return toast(r.error.message,1);

  toast('সব হিসাব শূন্য করা হয়েছে');refresh()}

/* ---------- BACKUP (Owner) ---------- */
async function backup(ev){
  const b=ev?.currentTarget||$('#bk'),lab='⬇ ব্যাকআপ ডাউনলোড (শুধু Owner)',set=t=>{b.textContent=t};b.disabled=true;set('ব্যাকআপ তৈরি হচ্ছে...');
  try{
    const T=['shop_settings','categories','units','products','product_unit_conversions','stock_movements','suppliers','customers','purchases','purchase_items','sales','sale_items','payments','cash_transactions','daily_closings','activity_logs','attachments','opening_stock_batches','profiles'],out={};
    for(const t of T)out[t]=await all(()=>sb.from(t).select('*'));
    const day=new Date(Date.now()+6*36e5).toISOString().slice(0,10),links=[],total=out.attachments.length;let fail=0,note='';
    links.push(`<a class="btn" id="bkl" style="display:block;text-decoration:none;margin-bottom:10px" href="${URL.createObjectURL(new Blob([JSON.stringify({app:'manik-shop',exported_at:new Date().toISOString(),tables:out},null,1)],{type:'application/json'}))}" download="manik-backup-${day}.json">⬇ ১) হিসাবের ফাইল সংরক্ষণ করুন</a>`);
    if(total&&!window.JSZip)note='<p class="bad">ছবির ব্যাকআপ চালু করা যায়নি (ইন্টারনেট সমস্যা)। পাতা রিফ্রেশ করে আবার চেষ্টা করুন।</p>';
    else if(total){
      let zip=new JSZip(),size=0,part=0,n=0;
      const flush=async()=>{if(!n)return;part++;const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
        links.push(`<a class="btn" style="display:block;text-decoration:none;margin-bottom:10px" href="${URL.createObjectURL(blob)}" download="manik-photos-${day}-${part}.zip">⬇ ${qty(part+1)}) ছবির ফাইল ${qty(part)} (${qty(n)}টি ছবি)</a>`);zip=new JSZip();size=0;n=0};
      for(let i=0;i<total;i++){set(`ছবি নামছে ${qty(i+1)}/${qty(total)}...`);
        try{const p=out.attachments[i].storage_path,r=await sb.storage.from('shop-files').download(p);if(r.error)throw r.error;zip.file(p,r.data);size+=r.data.size;n++;if(size>25e6)await flush()}catch(e){fail++}}
      await flush();
    }
    popup(`<h2>✅ ব্যাকআপ প্রস্তুত</h2><p>নিচের <b>প্রতিটি</b> বাটনে চেপে ফাইল Files অ্যাপে সংরক্ষণ করুন। এই পাতা বন্ধ করার আগে সবগুলো রাখুন।</p>${links.join('')}${fail?`<p class="bad">${qty(fail)}টি ছবি নামানো যায়নি। আবার ব্যাকআপ নিন।</p>`:''}${note}${total?'':'<p class="note">এখনো কোনো ছবি যোগ করা হয়নি।</p>'}`);
    $('#bkl').onclick=()=>{sb.from('shop_settings').update({last_backup_at:new Date().toISOString()}).eq('id',1).then(()=>{})};
  }catch(e){toast('ব্যাকআপ হয়নি: '+(e.message||e),1)}finally{b.disabled=false;set(lab)}
}

      if(files.length){b.textContent='ছবি আপলোড হচ্ছে...';const n=await upload(op?'opening_stock':'purchase',op?rid:r.data,files);if(n<files.length)toast('কিছু ছবি যায়নি। তালিকা থেকে "📎 ছবি" চেপে আবার দিন।',1)}
      if(op)popup(`<h2>✅ মজুদ তোলা হয়েছে</h2><p>মোট মূল্য: <b>${money(t)}</b><br>ক্যাশ বা দেনায় কোনো পরিবর্তন হয়নি।</p>`)
      else if(buy)popup(`<h2>✅ ক্রয় সংরক্ষণ হয়েছে</h2><p>মোট ক্রয়: <b>${money(t)}</b><br>পরিশোধ: ${money(paid)}<br>বাকি দেনা: ${money(t-paid)}</p>`);
      else{const{data:s}=await sb.from('sales').select('invoice_no,cost_total').eq('id',r.data).single(),pr=t-Number(s?.cost_total||0);
        popup(pr>=0?`<h2>🎉 অভিনন্দন!</h2><p>আপনার বিক্রি সফলভাবে সম্পন্ন হয়েছে।</p><p>মোট বিক্রি: <b>${money(t)}</b><br>আনুমানিক লাভ: <b class="good">${money(pr)}</b><br>নগদ পেয়েছেন: ${money(paid)} · বাকি: ${money(t-paid)}</p><p class="note">Invoice: ${esc(s?.invoice_no)}</p>`
          :`<h2>⚠️ লোকসান হয়েছে</h2><p>এই বিক্রিতে লোকসান: <b class="bad">${money(-pr)}</b></p><p class="note">চিন্তা করবেন না, সঠিক হিসাব রাখুন এবং পরের সিদ্ধান্ত আরও ভালোভাবে নিন।</p>`)}
    }catch(er){b.disabled=false;b.textContent=lbl;toast(er.message||String(er),1)}finally{busy=false}};
  if(op){const[{data:bs},{data:mv}]=await Promise.all([sb.from('opening_stock_batches').select('request_id,created_at').order('created_at',{ascending:false}).limit(30),sb.from('stock_movements').select('ref_id,products(name)').eq('ref_type','opening_stock').limit(1000)]);
    $('#rc').innerHTML='<h2>আগের মজুদের তালিকা</h2>'+((bs||[]).map(b=>`<div class="card row" style="margin-bottom:8px"><span>${fd(b.created_at)}<br><small>${esc((mv||[]).filter(m=>m.ref_id===b.request_id).map(m=>m.products?.name).filter(Boolean).join(', '))}</small></span><button class="btn ghost sm" data-ph="${b.request_id}">📎 ছবি</button></div>`).join('')||'<p class="note">এখনো কিছু নেই।</p>');
    $('#rc').onclick=e=>{if(e.target.dataset?.ph)viewer('opening_stock',e.target.dataset.ph)};return}
  const{data:rec}=await sb.from(buy?'purchases':'sales').select(buy?'id,total,due,created_at,suppliers(name),purchase_items(products(name))':'id,invoice_no,total,due,status,created_at').order('created_at',{ascending:false}).limit(buy?50:15);
  $('#rc').innerHTML=`<h2>সাম্প্রতিক ${buy?'ক্রয়':'বিক্রি'}</h2>${buy?'<input id="rs" placeholder="পণ্য বা Supplier দিয়ে খুঁজুন">':''}`+((rec||[]).map(r=>`<div class="card row" style="margin-bottom:8px"><span>${buy?'':esc(r.invoice_no)+' • '}${fd(r.created_at)}${r.status==='void'?' <b class="bad">(বাতিল)</b>':''}${buy?`<br><small>${esc(r.suppliers?.name||'Supplier নেই')}: ${esc((r.purchase_items||[]).map(i=>i.products?.name).filter(Boolean).join(', '))}</small>`:''}</span><span>${money(r.total)}${Number(r.due)>0?` <small class="warn">বাকি ${money(r.due)}</small>`:''}${buy?` <button class="btn ghost sm" data-ph="${r.id}">📎 ছবি</button>`:''}${!buy&&r.status!=='void'?` <button class="btn ghost sm" data-v="${r.id}">বাতিল</button>`:''}</span></div>`).join('')||'<p class="note">এখনো কিছু নেই।</p>');
  if(buy)$('#rs').oninput=()=>{const k=$('#rs').value.trim().toLowerCase();[...$('#rc').querySelectorAll('.card')].forEach(c=>c.hidden=!c.textContent.toLowerCase().includes(k))};
  $('#rc').onclick=async e=>{if(e.target.dataset?.ph)return viewer('purchase',e.target.dataset.ph);const id=e.target.dataset?.v;if(!id||!confirm('এই বিক্রি বাতিল করবেন? স্টক ফেরত আসবে এবং নগদ টাকা ফেরত হিসেবে লেখা হবে।'))return;
    const r=await sb.rpc('void_sale',{p_sale_id:id,p_reason:'বাতিল করা হয়েছে'});r.error?toast(r.error.message,1):(toast('বিক্রি বাতিল হয়েছে'),refresh())};
}

/* ---------- PULL TO REFRESH ---------- */
let y0=null,pull=0;const ptr=$('#ptr');
addEventListener('touchstart',e=>{y0=(scrollY<=0&&me&&!document.querySelector('.sheet'))?e.touches[0].clientY:null;pull=0},{passive:true});
addEventListener('touchmove',e=>{if(y0==null)return;pull=e.touches[0].clientY-y0;if(pull>0)ptr.style.transform=`translateY(${Math.min(pull,110)}px)`},{passive:true});
addEventListener('touchend',()=>{if(y0!=null&&pull>80){ptr.style.transform='translateY(70px)';refresh().finally(()=>ptr.style.transform='')}else ptr.style.transform='';y0=null});

/* ---------- START ---------- */
(async()=>{const{data:{session}}=await sb.auth.getSession();session?afterLogin(session.user):loginView()})();
</script>
</body>
</html>
